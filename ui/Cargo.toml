[package]
name = "rvc-realtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "COSMIC front end for the RVC real-time voice conversion engine"

[dependencies]
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["io-util", "net", "process", "time"] }
url = "2.5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
branch = "master"
default-features = false
features = ["a11y", "dbus-config", "multi-window", "tokio", "wayland", "winit", "wgpu", "xdg-portal"]

[profile.release]
lto = "thin"
